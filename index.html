        ];

        guestGroups.forEach((group, index) => group.id = index);

        onValue(guestRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                guestGroups.forEach(g => {
                    if (data[g.id] !== undefined) {
                        g.arrivedPax = data[g.id].arrivedPax;
                    }
                });
            } else {
                let initialUpload = {};
                guestGroups.forEach(g => {
                    initialUpload[g.id] = { arrivedPax: g.arrivedPax };
                });
                set(guestRef, initialUpload);
            }
            updateDashboardCounters();
            searchGuest();
        }, (error) => {
            console.error("Firebase fetch failed: ", error);
            // Fallback rendering if database is locked out
            updateDashboardCounters();
            searchGuest();
        });

        function updateDashboardCounters() {
            let total = 0;
            let arrived = 0;
            guestGroups.forEach(g => {
                total += g.totalPax;
                arrived += g.arrivedPax;
            });
            let absent = total - arrived;

            document.getElementById('totalPax').innerText = total;
            document.getElementById('totalArrived').innerText = arrived;
            document.getElementById('totalAbsent').innerText = absent;
        }

        window.setFilter = function(filterType) {
            currentFilter = filterType;
            document.getElementById('tabAll').classList.remove('active-filter');
            document.getElementById('tabHadir').classList.remove('active-filter');
            document.getElementById('tabBelum').classList.remove('active-filter');

            const indicator = document.getElementById('filterIndicator');
            if (filterType === 'all') {
                document.getElementById('tabAll').classList.add('active-filter');
                indicator.style.display = 'none';
            } else if (filterType === 'hadir') {
                document.getElementById('tabHadir').classList.add('active-filter');
                indicator.innerText = "Filter: Attended Groups";
                indicator.style.display = 'block';
            } else if (filterType === 'belum') {
                document.getElementById('tabBelum').classList.add('active-filter');
                indicator.innerText = "Filter: Absent Groups";
                indicator.style.display = 'block';
            }
            searchGuest();
        }

        window.checkInEntireGroup = function(id) {
            const group = guestGroups.find(g => g.id === id);
            if (group) {
                const targetPax = (group.arrivedPax === group.totalPax) ? 0 : group.totalPax;
                set(ref(db, `guests/${id}`), { arrivedPax: targetPax });
            }
        }

        window.adjustPaxCount = function(id, change) {
            const group = guestGroups.find(g => g.id === id);
            if (group) {
                const newCount = group.arrivedPax + change;
                if (newCount >= 0 && newCount <= group.totalPax) {
                    set(ref(db, `guests/${id}`), { arrivedPax: newCount });
                }
            }
        }

        window.searchGuest = function() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            let filteredList = guestGroups;
            if (currentFilter === 'hadir') {
                filteredList = guestGroups.filter(g => g.arrivedPax > 0);
            } else if (currentFilter === 'belum') {
                filteredList = guestGroups.filter(g => g.arrivedPax === 0);
            }

            if (query !== '') {
                filteredList = filteredList.filter(g => g.name.toLowerCase().includes(query));
            }

            if (filteredList.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No invitation matches found.</div>';
                return;
            }

            filteredList.forEach(group => {
                const card = document.createElement('div');
                let statusClass = 'belum';
                let statusLabel = 'Belum Hadir';
                let cardStateClass = '';
                let mainBtnText = 'Check In All';
                let mainBtnClass = '';

                if (group.arrivedPax === group.totalPax) {
                    statusClass = 'hadir';
                    statusLabel = 'Hadir';
                    cardStateClass = 'checked-in';
                    mainBtnText = 'Undo All';
                    mainBtnClass = 'undo';
                } else if (group.arrivedPax > 0) {
                    statusClass = 'partial';
                    statusLabel = `${group.arrivedPax} / ${group.totalPax} Arrived`;
                    cardStateClass = 'partial-checkin';
                }

                card.className = `guest-card ${cardStateClass}`;
                card.innerHTML = `
                    <div class="guest-details">
                        <div class="guest-header">
                            <div class="guest-name">${group.name}</div>
                            <span class="pax-badge">${group.totalPax} Pax</span>
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="seating-remarks">
                            <strong>Table Setup:</strong> ${group.remarks}
                        </div>
                    </div>
                    <div class="action-area">
                        <button class="btn-checkin ${mainBtnClass}" onclick="checkInEntireGroup(${group.id})">${mainBtnText}</button>
                        <div class="counter-controls">
                            <button class="btn-counter" onclick="adjustPaxCount(${group.id}, -1)">-</button>
                            <span class="counter-val">${group.arrivedPax} Arrived</span>
                            <button class="btn-counter" onclick="adjustPaxCount(${group.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }
